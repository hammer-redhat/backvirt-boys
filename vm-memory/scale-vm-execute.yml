---
- name: VM Scaling Execution - Post Approval
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Authentication variables following AAP patterns
    vm_collect_openshift_host: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST', default=Undefined) | default('', True) }}"
    vm_collect_openshift_api_key: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY', default=Undefined) | default('', True) }}"
    vm_collect_openshift_verify_ssl: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_VERIFY_SSL', default='false') | default(false) | bool }}"
    vm_collect_verify_ssl: "{{ vm_collect_openshift_verify_ssl }}"
    openshift_api_key: "{{ vm_collect_openshift_api_key }}"
    openshift_host: "{{ vm_collect_openshift_host }}"
    openshift_verify_ssl: "{{ vm_collect_openshift_verify_ssl }}"

  tasks:
    - name: Debug all available variables
      ansible.builtin.debug:
        msg:
          - "=== ALL AVAILABLE VARIABLES ==="
          - "vm_namespace_approved: {{ vm_namespace_approved | default('NOT SET') }}"
          - "vm_name_approved: {{ vm_name_approved | default('NOT SET') }}"
          - "target_instance_type_approved: {{ target_instance_type_approved | default('NOT SET') }}"
          - "current_instance_type_approved: {{ current_instance_type_approved | default('NOT SET') }}"
          - "scaling_required: {{ scaling_required | default('NOT SET') }}"
          - ""
          - "Fallback variables:"
          - "vm_namespace: {{ vm_namespace | default('NOT SET') }}"
          - "vm_name: {{ vm_name | default('NOT SET') }}"
          - "namespace: {{ namespace | default('NOT SET') }}"
          - "new_instance_type: {{ new_instance_type | default('NOT SET') }}"

    - name: Use workflow variables from approval step
      ansible.builtin.set_fact:
        vm_namespace_final: "{{ vm_namespace_approved | default(vm_namespace) | default(namespace) | default('default') }}"
        vm_name_final: "{{ vm_name_approved | default(vm_name) | default('') }}"
        target_instance_type: "{{ target_instance_type_approved | default(new_instance_type) | default('') }}"
        current_instance_type: "{{ current_instance_type_approved | default('unknown') }}"
        scaling_required: "{{ scaling_required | default(true) | bool }}"

    - name: Validate approved variables
      ansible.builtin.assert:
        that:
          - vm_name_final != ''
          - vm_namespace_final != ''
          - target_instance_type != ''
        fail_msg: "Missing required approval variables. This job should be run after the approval workflow."

    - name: Display scaling execution start
      ansible.builtin.debug:
        msg:
          - "========== EXECUTING APPROVED VM SCALING =========="
          - "VM: {{ vm_name_final }}"
          - "Namespace: {{ vm_namespace_final }}"
          - "Current Instance Type: {{ current_instance_type }}"
          - "Target Instance Type: {{ target_instance_type }}"
          - "Starting scaling operation..."

    - name: Skip scaling if no change needed
      ansible.builtin.debug:
        msg: "VM {{ vm_name_final }} is already at the target instance type {{ current_instance_type }}. No scaling needed."
      when: not scaling_required

    # Perform the actual VM scaling using hot plug pattern
    - name: Execute approved VM instance type scaling
      block:
        - name: Re-collect current VM information
          ansible.builtin.include_role:
            name: infra.openshift_virtualization_ops.vm_collect
          vars:
            vm_collect_vms_var: collected_vms
            vm_collect_request_instance:
              name: "{{ vm_name_final }}"
              namespace: "{{ vm_namespace_final }}"

        - name: Extract current VM for scaling
          ansible.builtin.set_fact:
            target_vm: "{{ collected_vms | selectattr('response_obj.metadata.name', 'equalto', vm_name_final) | list | first }}"

        - name: Execute VM Hot Plugging for instance type change
          ansible.builtin.include_role:
            name: infra.openshift_virtualization_ops.vm_hot_plug
          vars:
            vm_hot_plug_vms:
              - "{{ target_vm | combine({'compute': {'instanceType': target_instance_type}}) }}"

        - name: Wait for scaling operation to complete
          ansible.builtin.pause:
            seconds: 10
            prompt: "Waiting for scaling operation to take effect..."

        - name: Verify scaling operation
          ansible.builtin.include_role:
            name: infra.openshift_virtualization_ops.vm_collect
          vars:
            vm_collect_vms_var: updated_vms
            vm_collect_request_instance:
              name: "{{ vm_name_final }}"
              namespace: "{{ vm_namespace_final }}"

        - name: Filter updated VMs
          ansible.builtin.set_fact:
            updated_vm_list: "{{ updated_vms | selectattr('response_obj.metadata.name', 'equalto', vm_name_final) | list }}"

        - name: Check if updated VM was found
          ansible.builtin.fail:
            msg: |
              Failed to find updated VM '{{ vm_name_final }}' after scaling operation.
              This may indicate the scaling operation did not complete successfully.
              Available VMs: {{ updated_vms | map(attribute='response_obj.metadata.name') | list | join(', ') if updated_vms else 'None' }}
          when: updated_vm_list | length == 0

        - name: Extract updated VM information
          ansible.builtin.set_fact:
            updated_vm: "{{ updated_vm_list | first }}"
            updated_instance_type: "{{ updated_vm_list | first | json_query('response_obj.spec.instancetype.name') }}"

        - name: Display scaling operation result
          ansible.builtin.debug:
            msg:
              - "VM Scaling Operation Completed!"
              - "VM: {{ vm_name_final }}"
              - "Previous Instance Type: {{ current_instance_type }}"
              - "New Instance Type: {{ updated_instance_type }}"
              - "VM Status: {{ updated_vm.response_obj.status.printableStatus | default('unknown') }}"
              - "Operation: {{ 'SUCCESS' if updated_instance_type == target_instance_type else 'VERIFICATION_PENDING' }}"

        - name: Verify scaling success
          ansible.builtin.assert:
            that:
              - updated_instance_type == target_instance_type
            success_msg: "VM {{ vm_name_final }} successfully scaled to {{ target_instance_type }}"
            fail_msg: "VM scaling verification failed. Expected: {{ target_instance_type }}, Actual: {{ updated_instance_type }}"

      rescue:
        - name: Handle scaling operation failure
          ansible.builtin.debug:
            msg:
              - "VM Scaling Operation Failed!"
              - "VM: {{ vm_name_final }}"
              - "Target Instance Type: {{ target_instance_type }}"
              - "Error: {{ ansible_failed_result.msg | default('Unknown error occurred') }}"

        - name: Fail with detailed error information
          ansible.builtin.fail:
            msg: |
              VM scaling operation failed for {{ vm_name_final }}.
              Please check the VM status and OpenShift cluster resources.
              Error details: {{ ansible_failed_result.msg | default('Unknown error occurred') }}

      when: scaling_required

    # Final summary
    - name: Display final operation summary
      ansible.builtin.debug:
        msg:
          - "========== VM SCALING OPERATION SUMMARY =========="
          - "VM Name: {{ vm_name_final }}"
          - "Namespace: {{ vm_namespace_final }}"
          - "Operation: {{ 'Completed Successfully' if scaling_required else 'No Action Required' }}"
          - "Instance Type: {{ current_instance_type }} → {{ target_instance_type if scaling_required else current_instance_type }}"
          - "Timestamp: {{ ansible_date_time.iso8601 }}"
