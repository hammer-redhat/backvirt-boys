---
# VM Lifecycle Variables File
# Usage: ansible-playbook vm_lifecycle.yml -e @vm_lifecycle_vars.yml

# VM Operation Configuration
vm_operation: "restart"  # Options: start, stop, restart
vm_name: "hammer-test"   # Single VM name or comma-separated list
vm_namespace: "vms-aap-day2"  # OpenShift namespace
vm_label: ""             # Label selector (optional, comma-separated)

# Examples for different scenarios:
# Single VM restart:
# vm_operation: "restart"
# vm_name: "my-vm"
# vm_namespace: "default"

# Multiple VMs by name:
# vm_operation: "stop"
# vm_name: "vm1,vm2,vm3"
# vm_namespace: "production"

# VMs by label selector:
# vm_operation: "start"
# vm_name: ""  # Leave empty when using labels
# vm_label: "app=web,env=prod"
# vm_namespace: "production"